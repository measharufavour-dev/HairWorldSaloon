<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HairworldSaloon | Luxury Hair Salon</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --black:#0a0a0a;
  --gold:#c9a84c;
  --white:#faf8f3;
  --gray:#888;
  --sans:'Jost',sans-serif;
  --serif:'Cormorant Garamond',serif;
}

body {
  margin:0;
  font-family:var(--sans);
  background:var(--black);
  color:var(--white);
  line-height:1.6;
}

.container{max-width:1100px;margin:auto;padding:20px}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;
  background:rgba(0,0,0,0.8);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}
nav a{color:var(--white);text-decoration:none;margin:0 10px}

/* HERO */
.hero{padding:120px 20px 60px;text-align:center}
.hero h1{font-family:var(--serif);font-size:50px}
.hero em{color:var(--gold)}

/* BUTTONS */
.btn{
  display:inline-block;
  padding:12px 20px;
  background:var(--gold);
  color:#000;
  text-decoration:none;
  margin-top:10px;
  font-weight:600;
}
.btn-outline{
  border:1px solid var(--gold);
  color:var(--white);
  background:transparent;
}

/* SECTIONS */
section{padding:60px 20px}

/* FORM */
form{
  background:#111;
  padding:25px;
  border:1px solid rgba(201,168,76,0.2);
}
input,select,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  background:#000;
  border:1px solid #333;
  color:white;
}
button{
  width:100%;
  padding:12px;
  background:var(--gold);
  border:none;
  font-weight:600;
  cursor:pointer;
}

/* SUCCESS */
#success{
  display:none;
  padding:20px;
  background:#111;
  border:1px solid var(--gold);
  margin-top:15px;
}

/* FLOAT BUTTON */
.floating{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--gold);
  color:#000;
  padding:14px 16px;
  border-radius:50px;
  text-decoration:none;
  font-weight:700;
  z-index:9999;
}
</style>
</head>

<body>

<nav>
  <div><strong>HairworldSaloon</strong></div>
  <div>
    <a href="#services">Services</a>
    <a href="#booking">Book</a>
  </div>
</nav>

<div class="hero">
  <h1>Where Every Strand <em>Tells a Story</em></h1>
  <p>Luxury hair styling in Benin City</p>
  <a href="#booking" class="btn">Book Appointment</a>
  <a href="#services" class="btn btn-outline">View Services</a>
</div>

<section id="services">
  <div class="container">
    <h2>Services</h2>
    <p>Hair styling, braids, wigs, bridal hair & more</p>
  </div>
</section>

<section id="booking">
  <div class="container">
    <h2>Book Appointment</h2>

    <form id="bookingForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="tel" id="phone" placeholder="Phone Number" required>

      <select id="service" required>
        <option value="">Select Service</option>
        <option>Hair Styling</option>
        <option>Braiding</option>
        <option>Wig Installation</option>
        <option>Bridal Hair</option>
      </select>

      <input type="date" id="date" required>
      <textarea id="message" placeholder="Extra details"></textarea>

      <button type="submit">Submit Booking</button>
    </form>

    <div id="success">
      ✅ Booking received! We will contact you shortly.
    </div>
  </div>
</section>

<a href="#booking" class="floating">Book Now</a>

<script>
// FORM HANDLER (REAL BACKEND-FREE SYSTEM)
const form = document.getElementById("bookingForm");
const success = document.getElementById("success");

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    service: document.getElementById("service").value,
    date: document.getElementById("date").value,
    message: document.getElementById("message").value
  };

  try {
    // SEND TO FORMSUBMIT (replace email below)
    await fetch("https://formsubmit.co/ajax/YOUR_EMAIL_HERE", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    success.style.display = "block";
    form.reset();

    // WhatsApp follow-up
    const text =
`New Booking Request
Name: ${data.name}
Phone: ${data.phone}
Service: ${data.service}
Date: ${data.date}
Details: ${data.message || "None"}`;

    setTimeout(()=>{
      window.open(
        "https://wa.me/2348012345678?text=" + encodeURIComponent(text),
        "_blank"
      );
    }, 800);

  } catch(err){
    alert("Error sending booking. Try WhatsApp instead.");
  }
});
</script>

</body>
</html>
